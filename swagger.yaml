                body:
                  type: string
                  description: Notification body/message
                data:
                  type: object
                  description: Optional custom data payload to include with notification
                  example:
                    type: key_transfer_request
                    transferId: "507f1f77bcf86cd799439011"
              required: [firebaseUid, title, body]
      responses:
        '200':
          description: Push notification sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    description: Firebase messaging response
        '400':
          description: Invalid request or user does not have valid FCM token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Server error while sending notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string

  /subscription/create:
    post:
      summary: Buy a plan (Subscriptions v2, Stripe Billing)
      tags: [Subscription]
      description: |
        Starts a Stripe subscription for the caller and answers with what the
        payment sheet needs. A customer covered by their linked partner's plan
        cannot buy one of their own while linked (409 `ON_PARTNERS_PLAN`) —
        one plan covers the pair. A customer holding their own live plan keeps
        the older 400 answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                tier:
                  type: string
                  enum: [street_cleaning, home_garage, valet_anywhere]
                interval:
                  type: string
                  enum: [week, month]
                movesPerWeek:
                  type: integer
                  enum: [1, 2]
                  description: street_cleaning only
                aspSchedule:
                  type: object
                  description: Required on street_cleaning (the cleaning days the auto-booker runs on)
                homeAddress:
                  type: object
                  description: Required on home_garage (the fixed address); dropped on other tiers
                promoCode:
                  type: string
                supportsSetupIntent:
                  type: boolean
              required: [userId, tier, interval]
      responses:
        '201':
          description: Subscription started — present the payment sheet, or already active when nothing is due
        '400':
          description: Missing or unknown fields, a bad promo code, or "You already have a subscription. Manage it from your profile."
        '404':
          description: User not found
        '409':
          description: "`ON_PARTNERS_PLAN` — \"You're on [First name]'s plan.\" The caller's linked partner holds a live plan that already covers them."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    default: false
                  code:
                    type: string
                    enum: [ON_PARTNERS_PLAN]
                  message:
                    type: string
        '503':
          description: Stripe not configured

  /subscription/generate-referral:
    post:
      summary: Generate referral code for doorman
      tags: [Subscription]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                doormanId:
                  type: string
                doormanName:
                  type: string
              required: [doormanId, doormanName]
      responses:
        '200':
          description: Referral code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  referralCode:
                    type: string

  /subscription/status/{userId}:
    get:
      summary: The plan covering this customer
      tags: [Subscription]
      description: |
        The customer's own live plan if they hold one. Otherwise, when they are
        linked and their partner holds a live plan, that plan — read-only:
        `hasActiveSubscription: true` (shipped builds read this and treat the
        partner as subscribed, which is correct), `readOnly: true`, and
        `heldBy` naming the holder. In that partner payload the fields about
        paying for and managing the plan are null (amountCents, interval,
        currentPeriodEnd, cancelAtPeriodEnd, homeAddressChangedAt,
        periodUsageCents, refundIfCancelledCents, promoCode, trial,
        valueIndicator); the tier, the coverage rows, the cleaning days and the
        fixed address stay. No Stripe id or card detail is in either payload.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hasActiveSubscription:
                    type: boolean
                  subscription:
                    type: object
                    nullable: true
                    description: buildStatusPayload (services/subscriptionService.js), or null
                  readOnly:
                    type: boolean
                    description: Present and true only when the plan is the linked partner's. The caller can see it and is covered by it, and cannot change, cancel or pay for it.
                  heldBy:
                    allOf:
                      - $ref: '#/components/schemas/PartnerSummary'
                    description: Present only with readOnly — the partner who holds the plan
        '500':
          description: Server error

  /subscription/quote:
    post:
      summary: What this booking will cost, and why
      tags: [Subscription]
      description: |
        Mounted at /api/subscription/quote (routes/quote.js). Uses the same
        coverage and pricing functions as createOrder. The plan considered is
        the customer's own, else their linked partner's.

        A plan covers one park at a time across a linked pair: while another car
        is riding it (an unfinished order stamped with the plan, or a car we are
        still holding on it, booked by someone other than this customer) a new
        park is `partner_park_live` — charged at list price and not indefinite.
        A retrieval is never refused by that rule.

        On a partner's plan, the sentences that say whose plan or whose home
        spot name the holder ("Free with Sam's plan").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: Also accepted as `customer`
                orderType:
                  type: string
                  enum: [parking, retrieval]
                aspMode:
                  type: boolean
                lat:
                  type: number
                lng:
                  type: number
                serviceType:
                  type: string
                carWatch:
                  type: boolean
                duration:
                  type: number
                originalOrderId:
                  type: string
                awayMode:
                  type: boolean
                awayService:
                  type: string
                awayDays:
                  type: number
                pickUpTime:
                  type: string
                  format: date-time
                awayEndTime:
                  type: string
                  format: date-time
              required: [userId]
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  covered:
                    type: boolean
                  reason:
                    type: string
                    enum:
                      - daily_free_park
                      - asp_move_covered
                      - retrieval_included_with_park
                      - no_active_subscription
                      - partner_park_live
                      - weekly_asp_limit_reached
                      - tier_has_no_free_park
                      - daily_free_park_used
                      - no_home_address_on_file
                      - order_location_missing
                      - not_at_home_address
                      - car_watch_not_covered
                      - away_not_covered
                      - retrieval_not_covered
                  label:
                    type: string
                    description: |
                      The short line next to the button. For partner_park_live:
                      "Not covered — [First name]'s park is using the plan"
                      (the partner's name), or "Not covered — another park is
                      using the plan" for anyone else's park.
                  detail:
                    type: string
                    description: One sentence. For partner_park_live, "It's covered again once that park ends."
                  priceCents:
                    type: integer
                    description: The only number to render; 0 means no payment step
                  listPriceCents:
                    type: integer
                  savedCents:
                    type: integer
                  indefinite:
                    type: boolean
                    description: False for a partner_park_live park — an ordinary paid park with an end time
                  indefiniteLabel:
                    type: string
                  plan:
                    type: object
                    nullable: true
                    properties:
                      tier:
                        type: string
                      name:
                        type: string
                      movesPerWeek:
                        type: integer
        '400':
          description: userId is required
        '404':
          description: User not found

  /subscription/cancel:
    post:
      summary: Cancel the caller's plan now, refunding what was not used
      tags: [Subscription]
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        '200':
          description: Cancelled, with the refund outcome
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '404':
          description: |
            The caller holds no live plan. When they are covered by their linked
            partner's plan the message says so: "That plan is on [First name]'s
            account." (only the holder can cancel it). Otherwise "No
            subscription to cancel".

  /subscription/change:
    post:
      summary: Change the caller's tier, interval or moves per week
      tags: [Subscription]
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                tier:
                  type: string
                  enum: [street_cleaning, home_garage, valet_anywhere]
                interval:
                  type: string
                  enum: [week, month]
                movesPerWeek:
                  type: integer
                homeAddress:
                  type: object
              required: [userId, tier, interval]
      responses:
        '200':
          description: Changed; answers with the new status payload
        '400':
          description: Unknown tier or interval, a bad address, or a change not allowed right now
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '404':
          description: |
            The caller holds no live plan. When they are covered by their linked
            partner's plan: "That plan is on [First name]'s account."
            Otherwise "No subscription to change".
        '503':
          description: Payment service unavailable

  /subscription/schedule:
    put:
      summary: Change the plan's cleaning days or fixed address
      tags: [Subscription]
      security:
