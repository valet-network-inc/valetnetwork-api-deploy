openapi: 3.0.0
info:
  title: Valet Network API
  version: 1.0.0
  description: API documentation for the Valet Network backend service
  contact:
    name: Valet Network Team

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://valetnycdev.nfndev.com/api
    description: Dev server
  - url: https://valetnyc-api-uat.nfndev.com/api
    description: UAT server
  - url: https://valetnyc-api-production.nfndev.com/api
    description: Temp Prod server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Order
    description: Order management and tracking
  - name: Payment
    description: Payment processing and guest checkout
  - name: Notification
    description: Push notifications and alerts
  - name: Subscription
    description: Subscription management
  - name: Account Link
    description: Two customer accounts sharing their parks and a plan (Profile → Link account)
  - name: Event
    description: Event code validation
  - name: Key Transfer
    description: Key transfer management between valets
  - name: Location
    description: Location-based features including free space marking
  - name: Admin
    description: Admin dashboard and analytics

components:
  securitySchemes:
    FirebaseIdToken:
      type: http
      scheme: bearer
      description: The signed-in customer's Firebase ID token. Its uid must match `firebaseUid` on the user the request names (middleware/requireSelf.js).

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        uid:
          type: string
        email:
          type: string
        displayName:
          type: string
        userType:
          type: string
          enum: [customer, valet]
        location:
          type: object
          properties:
            type:
              type: string
              default: Point
            coordinates:
              type: array
              items:
                type: number
        createdAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [pending, accepted, in_progress, completed, cancelled]
        pickupLocation:
          type: object
        vehicleInfo:
          type: object
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        planType:
          type: string
          enum: [monthly, annual]
        status:
          type: string
          enum: [active, cancelled, expired]
        startDate:
          type: string
          format: date-time
        renewalDate:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        _id:
          type: string
        order:
          type: string
          description: Order ID
        customer:
          type: string
          description: Customer user ID
        paymentIntentId:
          type: string
          description: Stripe payment intent ID
        amount:
          type: number
          description: Amount in cents
        currency:
          type: string
          default: usd
        clientSecret:
          type: string
        status:
          type: string
          enum: [pending, processing, succeeded, failed, canceled]
        paymentMethod:
          type: string
          enum: [card, apple_pay, google_pay]
        chargeId:
          type: string
        receiptUrl:
          type: string
        paymentMethodDetails:
          type: object
          properties:
            type:
              type: string
            last4:
              type: string
            brand:
              type: string
        failureReason:
          type: string
        failureCode:
          type: string
        paidAt:
          type: string
          format: date-time
        requestedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GuestPayment:
      type: object
      properties:
        _id:
          type: string
        conversationId:
          type: string
          description: Unique conversation ID (one guest payment per conversation)
        customer:
          type: string
          description: Customer user ID
        payment:
          type: string
          description: Payment record ID
        order:
          type: string
          description: Order ID
        amount:
          type: number
          description: Amount in cents
        currency:
          type: string
          default: usd
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
        paymentIntentId:
          type: string
          description: Stripe payment intent ID
        paymentLinkId:
          type: string
          description: Stripe payment link ID
        chargeId:
          type: string
        receiptUrl:
          type: string
        paymentMethodDetails:
          type: object
          properties:
            type:
              type: string
            last4:
              type: string
            brand:
              type: string
        paidAt:
          type: string
          format: date-time
        failureReason:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: string

    KeyTag:
      type: object
      properties:
        keyTagNumberold:
          type: integer
          minimum: 1
          maximum: 200
          description: Unique key tag number
        orderId:
          type: string
          description: Associated order ID
        vehicle:
          type: object
          properties:
            make:
              type: string
              description: Vehicle make/brand
            model:
              type: string
              description: Vehicle model
            color:
              type: string
              description: Vehicle color
            licensePlate:
              type: string
              description: Vehicle license plate
            keyTagNumber:
              type: string
              description: Key tag number
        parkingLocation:
          type: string
          description: Parking location address

    KeyTransfer:
      type: object
      properties:
        _id:
          type: string
          description: Transfer ID
        senderValet:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            phone:
              type: string
        receiverValet:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            phone:
              type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyTag'
        status:
          type: string
          enum: [pending_acceptance, accepted, rejected, cancelled]
          description: Transfer status
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        cancelledReason:
          type: string
        receiverConfirmedKeyTags:
          type: array
          items:
            type: integer

    KeyTransferAudit:
      type: object
      properties:
        _id:
          type: string
        transferId:
          type: string
        senderValet:
          type: object
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            phone:
              type: string
        receiverValet:
          type: object
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            phone:
              type: string
        keyCount:
          type: integer
        keyTags:
          type: array
          items:
            type: integer
        action:
          type: string
          enum: [initiated, accepted, rejected, cancelled]
        status:
          type: string
          enum: [pending_acceptance, accepted, rejected, cancelled]
        reason:
          type: string
        timestamp:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string

    Valet:
      type: object
      properties:
        _id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        profileImage:
          type: string

    FreeSpace:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          description: User ID who marked the free space
        segmentId:
          type: string
          description: Parking segment identifier
        latitude:
          type: number
          description: Latitude coordinate
        longitude:
          type: number
          description: Longitude coordinate
        createdAt:
          type: string
          format: date-time

    PartnerSummary:
      type: object
      description: |
        The only shape the other person in a linked pair ever leaves the server
        in (services/accountLinks.js partnerSummary). Never a user document: no
        full phone, email, address, Stripe id or Firebase uid.
      properties:
        _id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        profileImage:
          type: string
          nullable: true
        phoneMasked:
          type: string
          description: The last four digits of the phone, bare. Clients render it as "•••• 4821".
          example: '4821'

    AccountLinkView:
      type: object
      description: A link as one of its two people sees it. The same shape in every response and every accountLink:* socket event.
      properties:
        _id:
          type: string
        status:
          type: string
          enum: [open, pending, active, revoked, expired]
        role:
          type: string
          enum: [inviter, invitee]
          description: inviter showed the QR and taps Authorize; invitee scanned it
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the current step runs out — 10 minutes from mint while open, 10 minutes from the scan while pending. Null otherwise.
        authorizedAt:
          type: string
          format: date-time
          nullable: true

    AccountLinkError:
      type: object
      description: Clients map `code` to their own copy and fall back to "Something went wrong. Try again."
      properties:
        success:
          type: boolean
          default: false
        code:
          type: string
          enum: [INVALID, EXPIRED, SELF_LINK, ALREADY_LINKED, BOTH_HAVE_PLANS, NOT_PENDING, NOT_LINKED, NOT_YOURS, BAD_REQUEST]
        message:
          type: string

    SavedVehicle:
      type: object
      description: Profile → Your car. Stored on the account and hidden from every read that does not ask for it; only loginUser returns it.
      properties:
        color:
          type: string
        model:
          type: string
        licensePlate:
          type: string
          description: Upper-cased

    HouseholdOrder:
      description: An order in a customer read. Orders the caller's linked partner booked carry `bookedBy`; the caller's own carry none. A partner's order also arrives without the booker's payment details - no `paymentIntentId`, no `paymentDetails.clientSecret`, `chargeId`, `receiptUrl` or `paymentMethodDetails`, no `paymentIntentId` on `extensions` or `awayCharges`, and no `checkout.failureCode`/`failureMessage`. Amounts and `paymentStatus` stay. The same applies to the partner's copy of every order socket event.
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            bookedBy:
              $ref: '#/components/schemas/PartnerSummary'
            actedBy:
              type: string
              description: Set when the linked partner, not the booker, acted on this order (audit trail only; it still bills the booker)

paths:
  /auth/loginUser:
    post:
      summary: Login or register a user with phone number
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number
                firebaseUid:
                  type: string
                  description: Firebase UID from authentication
                fcmToken:
                  type: string
                  description: Firebase Cloud Messaging token for push notifications
                deviceId:
                  type: string
                  description: Device identifier
              required: [phone, firebaseUid]
      responses:
        '200':
          description: User logged in/registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isNewUser:
                    type: boolean
                    description: Indicates if this is a new user or returning user
                  message:
                    type: string
                    description: Status message
                  user:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          vehicle:
                            $ref: '#/components/schemas/SavedVehicle'
                    description: The account, including its saved car (Profile → Your car) when there is one
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/updateUser:
    post:
      summary: Update user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number (required)
                firstName:
                  type: string
                  description: User first name
                lastName:
                  type: string
                  description: User last name
                age:
                  type: number
                  description: User age
                isValet:
                  type: boolean
                  description: Whether user is a valet
                profileImage:
                  type: string
                  description: Profile image URL
                isDoorman:
                  type: boolean
                  description: Whether user is a doorman
                enterpriseCode:
                  type: string
                  description: Enterprise code for enterprise users
                enterpriseName:
                  type: string
                  description: Enterprise name for enterprise users
                userAgreementAccepted:
                  type: boolean
                  description: Whether user has accepted the user agreement
                vehicle:
                  type: object
                  nullable: true
                  description: |
                    Profile → Your car. Stored as exactly these three strings,
                    trimmed, the plate upper-cased; anything else on the object is
                    ignored. All three blank, or null, removes the saved car. Not
                    echoed back in `user` (the field is hidden from reads; loginUser
                    returns it).
                  properties:
                    color:
                      type: string
                    model:
                      type: string
                    licensePlate:
                      type: string
              required: [phone]
              example:
                phone: "+1234567890"
                firstName: "John"
                lastName: "Doe"
                age: 30
                isValet: false
                isDoorman: false
                userAgreementAccepted: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/getUsers:
    get:
      summary: Get all users
      tags: [Auth]
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /auth/getUserById/{userId}:
    get:
      summary: Get user by ID
      tags: [Auth]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /auth/updateLocation:
    post:
      summary: Update user location
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required: [userId, latitude, longitude]
      responses:
        '200':
          description: Location updated successfully

  /auth/checkUserType:
    post:
      summary: Check if user is valet or customer
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number
                firebaseUid:
                  type: string
                  description: Firebase UID
              description: Either phone or firebaseUid is required
      responses:
        '200':
          description: User type retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userType:
                    type: string
                    enum: [valet, customer]
                  userId:
                    type: string
                  phone:
                    type: string
                  firebaseUid:
                    type: string
                  isValet:
                    type: boolean
        '400':
          description: Missing phone or firebaseUid
        '404':
          description: User not found
        '500':
          description: Server error

  /auth/deleteAccount/{userId}:
    delete:
      summary: Delete user account
      tags: [Auth]
      description: |
        Also revokes the account's link, if it is in one (and any code or
        request it has out): both rooms get `accountLink:revoked` and the
        partner gets the "Account unlinked" push. That side-work never fails
        the delete.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted successfully
        '404':
          description: User not found

  /account-link/invite:
    post:
      summary: Mint the QR code that links two accounts
      tags: [Account Link]
      description: |
        The phone showing the code calls this. Returns a fresh 32-byte base64url
        token, good for 10 minutes; the QR the clients render encodes
        `valetnyc://link/<token>`. Only a sha256 of the token is stored.

        Minting retires every code the caller already has out — including one
        somebody has scanned and is waiting on (that scanner gets
        `accountLink:declined`). Read `GET /account-link/status` before minting
        so a waiting request is shown, not thrown away.

        Rate limit: 10 an hour per userId (401/403 answers are not counted).
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The caller's own user id (must match the token)
              required: [userId]
      responses:
        '200':
          description: Code minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: 43 characters, base64url. Never returned again.
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '409':
          description: "`ALREADY_LINKED` — the caller is already linked. Pairs only."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '429':
          description: Too many codes this hour

  /account-link/claim:
    post:
      summary: Scan someone's code and ask to link
      tags: [Account Link]
      description: |
        The scanner. Sets the link `pending` with the caller as invitee; the
        person who showed the code then has 10 minutes to Authorize.

        Emits `accountLink:requested { link, from }` to the code owner's room
        (`from` = the scanner's PartnerSummary) and pushes them
        "Someone scanned your code" / "[First name] wants to link. Open
        Profile → Link account to approve." with data
        `{ type: 'accountLink', linkStatus: 'pending' }`.

        A successful scan also retires the scanner's own open code and any
        earlier request they were waiting on (the other end of each gets
        `accountLink:declined`). The same scanner sending the same code again
        while it is pending gets the same 200.

        Refusals are checked in this order: INVALID, EXPIRED, SELF_LINK,
        ALREADY_LINKED, BOTH_HAVE_PLANS.

        Rate limit: 10 an hour per userId (401/403 answers are not counted).
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                token:
                  type: string
                  description: The bare token, or the whole scanned `valetnyc://link/<token>` string
              required: [userId, token]
      responses:
        '200':
          description: Request made; waiting on the code owner's Authorize
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  link:
                    $ref: '#/components/schemas/AccountLinkView'
                  waitingFor:
                    $ref: '#/components/schemas/PartnerSummary'
        '400':
          description: "`SELF_LINK` — \"That's your own code.\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '404':
          description: |
            `INVALID` — "We don't recognise that code." One answer for a code
            that never existed, was replaced by a newer one, was already used,
            declined or cancelled, or is somebody else's pending request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '409':
          description: |
            `ALREADY_LINKED` — "That account is already linked with someone."
            (either of the two), or `BOTH_HAVE_PLANS` — "You both have a plan.
            One of you has to cancel theirs first."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '410':
          description: "`EXPIRED` — \"That code has expired. Ask them to open Link account again.\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '429':
          description: Too many scans this hour

  /account-link/authorize:
    post:
      summary: Approve a scan — the one verification step
      tags: [Account Link]
      description: |
        Only the person who SHOWED the code (the inviter) can call this. Flips
        the link `pending → active` with a write guarded on the status; the
        partial unique indexes on AccountLink refuse a second active link for
        either account under any race.

        Then, if exactly one of the two has a car saved (a licence plate), it is
        copied into the other's empty profile — never over a saved one.

        Emits `accountLink:active { link, partner, vehicle }` to EACH room
        separately: `partner` is the other person's summary and `vehicle` that
        room owner's own saved car after the copy (or null). Pushes the scanner
        "You're linked" / "[First name] approved it. You both see the same parks
        now." with data `{ type: 'accountLink', linkStatus: 'active' }`.

        Rate limit: 20 an hour per userId, shared with decline and unlink.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                linkId:
                  type: string
              required: [userId, linkId]
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  link:
                    $ref: '#/components/schemas/AccountLinkView'
                  partner:
                    $ref: '#/components/schemas/PartnerSummary'
                  vehicle:
                    allOf:
                      - $ref: '#/components/schemas/SavedVehicle'
                    nullable: true
                    description: The caller's own saved car after the copy, or null
        '400':
          description: "`BAD_REQUEST` — linkId is missing"
        '401':
          description: No valid Firebase ID token
        '403':
          description: |
            Either the token is not this account's, or `NOT_YOURS` — no such
            link, or the caller is not the one who showed the code. One answer
            for both.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '409':
          description: |
            `NOT_PENDING` — "That request is no longer waiting." (declined,
            cancelled, replaced, or its 10 minutes ran out);
            `BOTH_HAVE_PLANS` — re-checked here because a plan can be bought
            between the scan and the tap (the request stays pending);
            `ALREADY_LINKED` — one of them was linked elsewhere in the meantime
            (the request is retired and the scanner gets `accountLink:declined`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '429':
          description: Too many changes this hour

  /account-link/decline:
    post:
      summary: Turn a scan away ("Not them")
      tags: [Account Link]
      description: |
        Inviter only. Sets the link `revoked` and emits
        `accountLink:declined { link }` to the scanner's room. No push.
        The scanner cancelling their own request is `POST /account-link/unlink`,
        not this.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                linkId:
                  type: string
              required: [userId, linkId]
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: "`BAD_REQUEST` — linkId is missing"
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's, or `NOT_YOURS` (no such link / not the inviter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '409':
          description: "`NOT_PENDING` — \"That request is no longer waiting.\""
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '429':
          description: Too many changes this hour

  /account-link/unlink:
    post:
      summary: Unlink, or cancel a scan that is waiting
      tags: [Account Link]
      description: |
        Either of the pair, any time. Revokes the caller's ACTIVE link
        (`revokedBy` = the caller), emits `accountLink:revoked { link }` to both
        rooms and pushes the other person "Account unlinked" / "[First name]
        unlinked from you. You no longer see each other's parks." with data
        `{ type: 'accountLink', linkStatus: 'revoked' }`. Touches no order and
        no plan: coverage for the non-holder simply stops being found, and a
        park already in progress finishes on the terms it was booked on.

        With no active link, withdraws the caller's PENDING request as the
        scanner (the waiting screen's Cancel) and emits
        `accountLink:declined { link }` to the code owner's room.
      security:
        - FirebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        '200':
          description: Unlinked, or the request withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '404':
          description: "`NOT_LINKED` — \"You're not linked with anyone.\" No link and no request to withdraw."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkError'
        '429':
          description: Too many changes this hour

  /account-link/status:
    get:
      summary: Where the caller's link stands — the panel's one read
      tags: [Account Link]
      description: |
        From the caller's point of view. Polled every 3 s while the Link account
        panel is open, as the fallback for the socket events. An open code or a
        pending request past its 10 minutes reads as `none` (and is marked
        expired on the way).

        Rate limit: 60 a minute per userId.
      security:
        - FirebaseIdToken: []
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Link status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    enum: [none, open, pending, active]
                  link:
                    allOf:
                      - $ref: '#/components/schemas/AccountLinkView'
                    nullable: true
                  partner:
                    allOf:
                      - $ref: '#/components/schemas/PartnerSummary'
                    nullable: true
                    description: Set when active
                  pendingFrom:
                    allOf:
                      - $ref: '#/components/schemas/PartnerSummary'
                    nullable: true
                    description: Set when pending and the caller showed the code (show Authorize)
                  waitingFor:
                    allOf:
                      - $ref: '#/components/schemas/PartnerSummary'
                    nullable: true
                    description: Set when pending and the caller scanned (show the spinner)
                  plan:
                    type: object
                    description: The plan covering the caller, and whose it is
                    properties:
                      heldBy:
                        type: string
                        enum: [self, partner]
                        nullable: true
                      tier:
                        type: string
                        enum: [street_cleaning, home_garage, valet_anywhere]
                        nullable: true
                      name:
                        type: string
                        nullable: true
                        description: Display name from services/subscriptionPlans.js, e.g. "Fixed garage"
        '400':
          description: userId is required
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '429':
          description: Too many refreshes

  /payment/createPaymentIntent:
    post:
      summary: Create a Stripe payment intent for an order
      tags: [Payment]
      description: Creates a payment intent and payment record. Payment method will be determined when frontend confirms payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: Order ID to create payment for
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                  description: Currency code (default USD)
              required: [orderId, amount]
      responses:
        '200':
          description: Payment intent created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  clientSecret:
                    type: string
                    description: Stripe client secret for frontend payment confirmation
                  paymentIntentId:
                    type: string
                    description: Stripe payment intent ID
                  paymentId:
                    type: string
                    description: Payment record ID in database
        '400':
          description: Missing required fields (orderId, amount)
        '404':
          description: Order not found
        '503':
          description: Stripe API key not configured

  /payment/getPaymentStatus:
    get:
      summary: Get guest payment status by conversation ID
      tags: [Payment]
      description: Fetches guest payment status from database and verifies with Stripe if payment intent exists
      parameters:
        - name: conversationId
          in: query
          schema:
            type: string
          required: true
          description: Conversation ID for guest checkout
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  conversationId:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, succeeded, failed]
                  amount:
                    type: number
                  currency:
                    type: string
                  paidAt:
                    type: string
                    format: date-time
                  paymentIntentId:
                    type: string
                  paymentLinkId:
                    type: string
                  chargeId:
                    type: string
                  receiptUrl:
                    type: string
                  paymentMethodDetails:
                    type: object
        '400':
          description: Missing conversationId parameter
        '404':
          description: Payment not found for this conversation

  /payment/webhook:
    post:
      summary: Stripe webhook endpoint for payment events
      tags: [Payment]
      description: Receives Stripe webhook events (payment_intent.succeeded, payment_intent.payment_failed) and automatically updates GuestPayment status. Stripe will POST to this endpoint when payment status changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe webhook event payload
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Webhook processing failed or secret not configured

  /payment/webhook/test:
    post:
      summary: Test webhook endpoint (for manual testing)
      tags: [Payment]
      description: Test endpoint to manually send webhook events without Stripe signature verification. Use this to test webhook processing with custom JSON payloads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: evt_3T24kjDVABAZnsVJ1xRJAVY2
                type:
                  type: string
                  example: payment_intent.succeeded
                  enum: [payment_intent.succeeded, payment_intent.payment_failed]
                data:
                  type: object
                  properties:
                    object:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pi_3T24kjDVABAZnsVJ1qipgh0V
                        amount:
                          type: integer
                          example: 2000
                        currency:
                          type: string
                          example: usd
                        status:
                          type: string
                          example: succeeded
                        metadata:
                          type: object
                          properties:
                            conversationId:
                              type: string
                            orderId:
                              type: string
                        charges:
                          type: object
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Webhook processing failed

  /payment/createGuestPaymentLink:
    post:
      summary: Create a Stripe payment link for guest checkout
      tags: [Payment]
      description: Generates a shareable Stripe payment link for guest users (no account required). Automatically creates a GuestPayment record with the conversation ID. One guest payment per conversation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  format: phone
                  description: Guest phone number
                conversationId:
                  type: string
                  description: Unique conversation ID (one guest payment per conversation)
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                  description: Currency code (default USD)
              required: [phone, conversationId, amount]
      responses:
        '200':
          description: Payment link created successfully and GuestPayment record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  paymentUrl:
                    type: string
                    description: Shareable Stripe payment link URL
                  paymentLinkId:
                    type: string
                    description: Stripe payment link ID
                  guestPaymentId:
                    type: string
                    description: GuestPayment record ID in database
                  phone:
                    type: string
                  conversationId:
                    type: string
                  amount:
                    type: number
        '400':
          description: Missing required fields or guest payment already exists for this conversation
        '503':
          description: Stripe API key not configured

  /payment/updatePaymentStatus:
    post:
      summary: Update payment status for an order
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: Order ID
                paymentIntentId:
                  type: string
                  description: Stripe payment intent ID
                paymentStatus:
                  type: string
                  enum: [pending, paid, failed]
                  description: Payment status
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                clientSecret:
                  type: string
                  description: Stripe client secret
                chargeId:
                  type: string
                  description: Stripe charge ID
                receiptUrl:
                  type: string
                  description: Stripe receipt URL
                paymentMethodDetails:
                  type: object
                  properties:
                    type:
                      type: string
                    last4:
                      type: string
                    brand:
                      type: string
                failureReason:
                  type: string
                  description: Reason for payment failure
              required: [orderId, paymentIntentId, paymentStatus]
      responses:
        '200':
          description: Payment status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request or payment verification failed
        '404':
          description: Order not found
        '500':
          description: Server error

  /order/createOrder:
    post:
      summary: Create a new parking order (payment optional, can be added later)
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: string
                  description: Customer user ID
                customerLocation:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                    streetAddress:
                      type: string
                parkingType:
                  type: string
                  enum: [street, garage, private, retrieval]
                duration:
                  type: number
                  description: Duration in minutes
                pickUpTime:
                  type: string
                  format: date-time
                paymentMethod:
                  type: string
                  enum: [card, pm_card_visa, Apple Pay]
                totalAmount:
                  type: number
                  description: Amount in cents (optional, can be calculated at order completion)
                orderType:
                  type: string
                  enum: [parking, retrieval]
                paymentIntentId:
                  type: string
                  description: Optional - Stripe payment intent ID if payment is ready
                eventCode:
                  type: string
                  description: Optional - Event code for free services
                isFreeService:
                  type: boolean
                serviceType:
                  type: string
                  enum: [standard, park-and-hold]
                aspMode:
                  type: boolean
                  description: Optional - Enable ASP (Automatic Service Prompt) mode. If true, notification will be sent at asp_time (1.5 hours from order creation). Default is false.
              required: [customer, customerLocation, parkingType, duration, pickUpTime, paymentMethod]
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request or validation failed
        '500':
          description: Server error

  /order/createRetrievalOrder:
    post:
      summary: Create a retrieval order
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                parkedOrderId:
                  type: string
              required: [userId, parkedOrderId]
      responses:
        '200':
          description: Retrieval order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /order/getPendingOrders:
    get:
      summary: Get all pending orders
      tags: [Order]
      parameters:
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: skip
          schema:
            type: number
      responses:
        '200':
          description: List of pending orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /order/acceptOrder:
    post:
      summary: Accept an order as valet
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                valetId:
                  type: string
              required: [orderId, valetId]
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /order/hasActiveOrder:
    get:
      summary: Check if user has active order
      tags: [Order]
      description: |
        Customer side: a linked customer's live orders include their partner's.
        `activeOrder` is the caller's own live order when they have one, else
        the partner's; `activeOrders` is the full set, own first. Every order
        the caller did not book carries `bookedBy` (the partner's summary).
        Valet side (`isValet=true`) is unchanged.
      security:
        - FirebaseIdToken: []
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: isValet
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Active order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hasActiveOrder:
                    type: boolean
                  activeOrder:
                    allOf:
                      - $ref: '#/components/schemas/HouseholdOrder'
                    nullable: true
                  activeOrders:
                    type: array
                    items:
                      $ref: '#/components/schemas/HouseholdOrder'
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's

  /order/updateValetLocation:
    post:
      summary: Update valet location
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required: [orderId, latitude, longitude]
      responses:
        '200':
          description: Location updated

  /order/updateOrder:
    post:
      summary: Update order status (OTP required for completion unless already verified)
      tags: [Order]
      description: Update order status. If completing order, OTP is required unless it has been verified via verifyOTP endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                updates:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [pending, accepted, in_progress, parked, parked-with-keys, completed, cancelled]
                    notes:
                      type: string
                    review:
                      type: object
                      properties:
                        rating:
                          type: number
                          minimum: 0
                          maximum: 5
                        comment:
                          type: string
                otp:
                  type: string
                  description: OTP code required when status is 'completed' and OTP hasn't been verified yet
              required: [orderId, updates]
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: OTP required or invalid for order completion

  /order/verifyOTP:
    post:
      summary: Verify OTP for order completion
      tags: [Order]
      description: Verify OTP code for an order. Once verified, the order can be completed without providing OTP again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: ID of the order to verify OTP for
                otp:
                  type: string
                  description: 6-digit OTP code
              required: [orderId, otp]
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Order not found or no OTP exists

  /order/return_key:
    post:
      summary: Generate OTP for returning keys
      tags: [Order]
      description: Generate a return key OTP for an order. This OTP is used when returning keys to the customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: ID of the order to generate return key OTP for
              required: [orderId]
      responses:
        '200':
          description: Return key OTP generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    type: object
                    properties:
                      _id:
                        type: string
                      otp:
                        type: object
                        properties:
                          expiresAt:
                            type: string
                            format: date-time
                          verified:
                            type: boolean
                          type:
                            type: string
                            enum: [return_key]
        '404':
          description: Order not found
        '500':
          description: Failed to generate return key OTP

  /order/getOrdersByUser:
    get:
      summary: Get orders for a user
      tags: [Order]
      description: |
        Customer side: every order either of a linked pair booked, live and
        past, newest pickup first. Each one the caller did not book carries
        `bookedBy` (the partner's summary); the caller's own carry none.
        Valet side (`isValet=true`) is unchanged.
      security:
        - FirebaseIdToken: []
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: isValet
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: User's orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/HouseholdOrder'
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's

  /order/checkKeyTagAvailability:
    post:
      summary: Check if a key tag number is available
      tags: [Order]
      description: Check if a key tag number is available for use in active orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyTagNumber:
                  type: string
                  description: The key tag number to check for availability
              required: [keyTagNumber]
      responses:
        '200':
          description: Key tag availability check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  available:
                    type: boolean
                    description: Whether the key tag number is available
                  message:
                    type: string
                  conflictingOrderId:
                    type: string
                    description: Order ID if the key tag is already in use
        '400':
          description: Missing or invalid keyTagNumber
        '500':
          description: Failed to check key tag availability

  /order/addVehicleInfo:
