openapi: 3.0.0
info:
  title: Valet Network API
  version: 1.0.0
  description: API documentation for the Valet Network backend service
  contact:
    name: Valet Network Team

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://valetnycdev.nfndev.com/api
    description: Dev server
  - url: https://valetnyc-api-uat.nfndev.com/api
    description: UAT server
  - url: https://valetnyc-api-production.nfndev.com/api
    description: Temp Prod server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Order
    description: Order management and tracking
  - name: Payment
    description: Payment processing and guest checkout
  - name: Notification
    description: Push notifications and alerts
  - name: Subscription
    description: Subscription management
  - name: Event
    description: Event code validation
  - name: Key Transfer
    description: Key transfer management between valets
  - name: Location
    description: Location-based features including free space marking
  - name: Admin
    description: Admin dashboard and analytics

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        uid:
          type: string
        email:
          type: string
        displayName:
          type: string
        userType:
          type: string
          enum: [customer, valet]
        location:
          type: object
          properties:
            type:
              type: string
              default: Point
            coordinates:
              type: array
              items:
                type: number
        createdAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [pending, accepted, in_progress, completed, cancelled]
        pickupLocation:
          type: object
        vehicleInfo:
          type: object
        createdAt:
          type: string
          format: date-time

    Subscription:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        planType:
          type: string
          enum: [monthly, annual]
        status:
          type: string
          enum: [active, cancelled, expired]
        startDate:
          type: string
          format: date-time
        renewalDate:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        _id:
          type: string
        order:
          type: string
          description: Order ID
        customer:
          type: string
          description: Customer user ID
        paymentIntentId:
          type: string
          description: Stripe payment intent ID
        amount:
          type: number
          description: Amount in cents
        currency:
          type: string
          default: usd
        clientSecret:
          type: string
        status:
          type: string
          enum: [pending, processing, succeeded, failed, canceled]
        paymentMethod:
          type: string
          enum: [card, apple_pay, google_pay]
        chargeId:
          type: string
        receiptUrl:
          type: string
        paymentMethodDetails:
          type: object
          properties:
            type:
              type: string
            last4:
              type: string
            brand:
              type: string
        failureReason:
          type: string
        failureCode:
          type: string
        paidAt:
          type: string
          format: date-time
        requestedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GuestPayment:
      type: object
      properties:
        _id:
          type: string
        conversationId:
          type: string
          description: Unique conversation ID (one guest payment per conversation)
        customer:
          type: string
          description: Customer user ID
        payment:
          type: string
          description: Payment record ID
        order:
          type: string
          description: Order ID
        amount:
          type: number
          description: Amount in cents
        currency:
          type: string
          default: usd
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
        paymentIntentId:
          type: string
          description: Stripe payment intent ID
        paymentLinkId:
          type: string
          description: Stripe payment link ID
        chargeId:
          type: string
        receiptUrl:
          type: string
        paymentMethodDetails:
          type: object
          properties:
            type:
              type: string
            last4:
              type: string
            brand:
              type: string
        paidAt:
          type: string
          format: date-time
        failureReason:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: string

    KeyTag:
      type: object
      properties:
        keyTagNumberold:
          type: integer
          minimum: 1
          maximum: 200
          description: Unique key tag number
        orderId:
          type: string
          description: Associated order ID
        vehicle:
          type: object
          properties:
            make:
              type: string
              description: Vehicle make/brand
            model:
              type: string
              description: Vehicle model
            color:
              type: string
              description: Vehicle color
            licensePlate:
              type: string
              description: Vehicle license plate
            keyTagNumber:
              type: string
              description: Key tag number
        parkingLocation:
          type: string
          description: Parking location address

    KeyTransfer:
      type: object
      properties:
        _id:
          type: string
          description: Transfer ID
        senderValet:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            phone:
              type: string
        receiverValet:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            phone:
              type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyTag'
        status:
          type: string
          enum: [pending_acceptance, accepted, rejected, cancelled]
          description: Transfer status
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        cancelledReason:
          type: string
        receiverConfirmedKeyTags:
          type: array
          items:
            type: integer

    KeyTransferAudit:
      type: object
      properties:
        _id:
          type: string
        transferId:
          type: string
        senderValet:
          type: object
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            phone:
              type: string
        receiverValet:
          type: object
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            phone:
              type: string
        keyCount:
          type: integer
        keyTags:
          type: array
          items:
            type: integer
        action:
          type: string
          enum: [initiated, accepted, rejected, cancelled]
        status:
          type: string
          enum: [pending_acceptance, accepted, rejected, cancelled]
        reason:
          type: string
        timestamp:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string

    Valet:
      type: object
      properties:
        _id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        profileImage:
          type: string

    FreeSpace:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
          description: User ID who marked the free space
        segmentId:
          type: string
          description: Parking segment identifier
        latitude:
          type: number
          description: Latitude coordinate
        longitude:
          type: number
          description: Longitude coordinate
        createdAt:
          type: string
          format: date-time

paths:
  /auth/loginUser:
    post:
      summary: Login or register a user with phone number
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number
                firebaseUid:
                  type: string
                  description: Firebase UID from authentication
                fcmToken:
                  type: string
                  description: Firebase Cloud Messaging token for push notifications
                deviceId:
                  type: string
                  description: Device identifier
              required: [phone, firebaseUid]
      responses:
        '200':
          description: User logged in/registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  isNewUser:
                    type: boolean
                    description: Indicates if this is a new user or returning user
                  message:
                    type: string
                    description: Status message
                  user:
                    $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/updateUser:
    post:
      summary: Update user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number (required)
                firstName:
                  type: string
                  description: User first name
                lastName:
                  type: string
                  description: User last name
                age:
                  type: number
                  description: User age
                isValet:
                  type: boolean
                  description: Whether user is a valet
                profileImage:
                  type: string
                  description: Profile image URL
                isDoorman:
                  type: boolean
                  description: Whether user is a doorman
                enterpriseCode:
                  type: string
                  description: Enterprise code for enterprise users
                enterpriseName:
                  type: string
                  description: Enterprise name for enterprise users
                userAgreementAccepted:
                  type: boolean
                  description: Whether user has accepted the user agreement
              required: [phone]
              example:
                phone: "+1234567890"
                firstName: "John"
                lastName: "Doe"
                age: 30
                isValet: false
                isDoorman: false
                userAgreementAccepted: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/getUsers:
    get:
      summary: Get all users
      tags: [Auth]
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /auth/getUserById/{userId}:
    get:
      summary: Get user by ID
      tags: [Auth]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /auth/updateLocation:
    post:
      summary: Update user location
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required: [userId, latitude, longitude]
      responses:
        '200':
          description: Location updated successfully

  /auth/checkUserType:
    post:
      summary: Check if user is valet or customer
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: User phone number
                firebaseUid:
                  type: string
                  description: Firebase UID
              description: Either phone or firebaseUid is required
      responses:
        '200':
          description: User type retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  userType:
                    type: string
                    enum: [valet, customer]
                  userId:
                    type: string
                  phone:
                    type: string
                  firebaseUid:
                    type: string
                  isValet:
                    type: boolean
        '400':
          description: Missing phone or firebaseUid
        '404':
          description: User not found
        '500':
          description: Server error

  /auth/deleteAccount/{userId}:
    delete:
      summary: Delete user account
      tags: [Auth]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted successfully
        '404':
          description: User not found

  /payment/createPaymentIntent:
    post:
      summary: Create a Stripe payment intent for an order
      tags: [Payment]
      description: Creates a payment intent and payment record. Payment method will be determined when frontend confirms payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: Order ID to create payment for
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                  description: Currency code (default USD)
              required: [orderId, amount]
      responses:
        '200':
          description: Payment intent created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  clientSecret:
                    type: string
                    description: Stripe client secret for frontend payment confirmation
                  paymentIntentId:
                    type: string
                    description: Stripe payment intent ID
                  paymentId:
                    type: string
                    description: Payment record ID in database
        '400':
          description: Missing required fields (orderId, amount)
        '404':
          description: Order not found
        '503':
          description: Stripe API key not configured

  /payment/getPaymentStatus:
    get:
      summary: Get guest payment status by conversation ID
      tags: [Payment]
      description: Fetches guest payment status from database and verifies with Stripe if payment intent exists
      parameters:
        - name: conversationId
          in: query
          schema:
            type: string
          required: true
          description: Conversation ID for guest checkout
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  conversationId:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, succeeded, failed]
                  amount:
                    type: number
                  currency:
                    type: string
                  paidAt:
                    type: string
                    format: date-time
                  paymentIntentId:
                    type: string
                  paymentLinkId:
                    type: string
                  chargeId:
                    type: string
                  receiptUrl:
                    type: string
                  paymentMethodDetails:
                    type: object
        '400':
          description: Missing conversationId parameter
        '404':
          description: Payment not found for this conversation

  /payment/webhook:
    post:
      summary: Stripe webhook endpoint for payment events
      tags: [Payment]
      description: Receives Stripe webhook events (payment_intent.succeeded, payment_intent.payment_failed) and automatically updates GuestPayment status. Stripe will POST to this endpoint when payment status changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe webhook event payload
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Webhook processing failed or secret not configured

  /payment/webhook/test:
    post:
      summary: Test webhook endpoint (for manual testing)
      tags: [Payment]
      description: Test endpoint to manually send webhook events without Stripe signature verification. Use this to test webhook processing with custom JSON payloads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: evt_3T24kjDVABAZnsVJ1xRJAVY2
                type:
                  type: string
                  example: payment_intent.succeeded
                  enum: [payment_intent.succeeded, payment_intent.payment_failed]
                data:
                  type: object
                  properties:
                    object:
                      type: object
                      properties:
                        id:
                          type: string
                          example: pi_3T24kjDVABAZnsVJ1qipgh0V
                        amount:
                          type: integer
                          example: 2000
                        currency:
                          type: string
                          example: usd
                        status:
                          type: string
                          example: succeeded
                        metadata:
                          type: object
                          properties:
                            conversationId:
                              type: string
                            orderId:
                              type: string
                        charges:
                          type: object
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Webhook processing failed

  /payment/createGuestPaymentLink:
    post:
      summary: Create a Stripe payment link for guest checkout
      tags: [Payment]
      description: Generates a shareable Stripe payment link for guest users (no account required). Automatically creates a GuestPayment record with the conversation ID. One guest payment per conversation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  format: phone
                  description: Guest phone number
                conversationId:
                  type: string
                  description: Unique conversation ID (one guest payment per conversation)
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                  description: Currency code (default USD)
              required: [phone, conversationId, amount]
      responses:
        '200':
          description: Payment link created successfully and GuestPayment record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  paymentUrl:
                    type: string
                    description: Shareable Stripe payment link URL
                  paymentLinkId:
                    type: string
                    description: Stripe payment link ID
                  guestPaymentId:
                    type: string
                    description: GuestPayment record ID in database
                  phone:
                    type: string
                  conversationId:
                    type: string
                  amount:
                    type: number
        '400':
          description: Missing required fields or guest payment already exists for this conversation
        '503':
          description: Stripe API key not configured

  /payment/updatePaymentStatus:
    post:
      summary: Update payment status for an order
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: Order ID
                paymentIntentId:
                  type: string
                  description: Stripe payment intent ID
                paymentStatus:
                  type: string
                  enum: [pending, paid, failed]
                  description: Payment status
                amount:
                  type: number
                  description: Amount in cents
                currency:
                  type: string
                  default: usd
                clientSecret:
                  type: string
                  description: Stripe client secret
                chargeId:
                  type: string
                  description: Stripe charge ID
                receiptUrl:
                  type: string
                  description: Stripe receipt URL
                paymentMethodDetails:
                  type: object
                  properties:
                    type:
                      type: string
                    last4:
                      type: string
                    brand:
                      type: string
                failureReason:
                  type: string
                  description: Reason for payment failure
              required: [orderId, paymentIntentId, paymentStatus]
      responses:
        '200':
          description: Payment status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request or payment verification failed
        '404':
          description: Order not found
        '500':
          description: Server error

  /order/createOrder:
    post:
      summary: Create a new parking order (payment optional, can be added later)
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: string
                  description: Customer user ID
                customerLocation:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                    streetAddress:
                      type: string
                parkingType:
                  type: string
                  enum: [street, garage, private, retrieval]
                duration:
                  type: number
                  description: Duration in minutes
                pickUpTime:
                  type: string
                  format: date-time
                paymentMethod:
                  type: string
                  enum: [card, pm_card_visa, Apple Pay]
                totalAmount:
                  type: number
                  description: Amount in cents (optional, can be calculated at order completion)
                orderType:
                  type: string
                  enum: [parking, retrieval]
                paymentIntentId:
                  type: string
                  description: Optional - Stripe payment intent ID if payment is ready
                eventCode:
                  type: string
                  description: Optional - Event code for free services
                isFreeService:
                  type: boolean
                serviceType:
                  type: string
                  enum: [standard, park-and-hold]
                aspMode:
                  type: boolean
                  description: Optional - Enable ASP (Automatic Service Prompt) mode. If true, notification will be sent at asp_time (1.5 hours from order creation). Default is false.
              required: [customer, customerLocation, parkingType, duration, pickUpTime, paymentMethod]
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request or validation failed
        '500':
          description: Server error

  /order/createRetrievalOrder:
    post:
      summary: Create a retrieval order
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                parkedOrderId:
                  type: string
              required: [userId, parkedOrderId]
      responses:
        '200':
          description: Retrieval order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /order/getPendingOrders:
    get:
      summary: Get all pending orders
      tags: [Order]
      parameters:
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: skip
          schema:
            type: number
      responses:
        '200':
          description: List of pending orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /order/acceptOrder:
    post:
      summary: Accept an order as valet
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                valetId:
                  type: string
              required: [orderId, valetId]
      responses:
        '200':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /order/hasActiveOrder:
    get:
      summary: Check if user has active order
      tags: [Order]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hasActiveOrder:
                    type: boolean
                  order:
                    $ref: '#/components/schemas/Order'

  /order/updateValetLocation:
    post:
      summary: Update valet location
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
              required: [orderId, latitude, longitude]
      responses:
        '200':
          description: Location updated

  /order/updateOrder:
    post:
      summary: Update order status (OTP required for completion unless already verified)
      tags: [Order]
      description: Update order status. If completing order, OTP is required unless it has been verified via verifyOTP endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                updates:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [pending, accepted, in_progress, parked, parked-with-keys, completed, cancelled]
                    notes:
                      type: string
                    review:
                      type: object
                      properties:
                        rating:
                          type: number
                          minimum: 0
                          maximum: 5
                        comment:
                          type: string
                otp:
                  type: string
                  description: OTP code required when status is 'completed' and OTP hasn't been verified yet
              required: [orderId, updates]
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: OTP required or invalid for order completion

  /order/verifyOTP:
    post:
      summary: Verify OTP for order completion
      tags: [Order]
      description: Verify OTP code for an order. Once verified, the order can be completed without providing OTP again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: ID of the order to verify OTP for
                otp:
                  type: string
                  description: 6-digit OTP code
              required: [orderId, otp]
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Order not found or no OTP exists

  /order/return_key:
    post:
      summary: Generate OTP for returning keys
      tags: [Order]
      description: Generate a return key OTP for an order. This OTP is used when returning keys to the customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  description: ID of the order to generate return key OTP for
              required: [orderId]
      responses:
        '200':
          description: Return key OTP generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    type: object
                    properties:
                      _id:
                        type: string
                      otp:
                        type: object
                        properties:
                          expiresAt:
                            type: string
                            format: date-time
                          verified:
                            type: boolean
                          type:
                            type: string
                            enum: [return_key]
        '404':
          description: Order not found
        '500':
          description: Failed to generate return key OTP

  /order/getOrdersByUser:
    get:
      summary: Get orders for a user
