                  type: string
                  description: Receiver valet ID
                keyOrderIds:
                  type: array
                  items:
                    type: string
                  description: Array of order IDs for keys to transfer
              required: [userId, receiverValetId, keyOrderIds]
      responses:
        '201':
          description: Transfer request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/KeyTransfer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

