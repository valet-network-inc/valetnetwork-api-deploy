          description: Firebase not configured

  /notification/send-push:
    post:
      summary: Send push notification to a single user
      tags: [Notification]
      description: Send a push notification to a specific user using their Firebase UID. Retrieves FCM token from Firestore and sends notification via Firebase Cloud Messaging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firebaseUid:
                  type: string
                  description: Firebase UID of the recipient
                title:
                  type: string
                  description: Notification title
                body:
                  type: string
                  description: Notification body/message
                data:
                  type: object
                  description: Optional custom data payload to include with notification
                  example:
                    type: key_transfer_request
                    transferId: "507f1f77bcf86cd799439011"
              required: [firebaseUid, title, body]
      responses:
        '200':
          description: Push notification sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    description: Firebase messaging response
        '400':
          description: Invalid request or user does not have valid FCM token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '500':
          description: Server error while sending notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string

