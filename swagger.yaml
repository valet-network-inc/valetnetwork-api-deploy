                  type: string
                aspSchedule:
                  type: object
                homeAddress:
                  type: object
              required: [userId]
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid schedule or address, or the address was changed too recently
        '401':
          description: No valid Firebase ID token
        '403':
          description: The token is not this account's
        '404':
          description: |
            The caller holds no live plan. When they are covered by their linked
            partner's plan: "That plan is on [First name]'s account."
            Otherwise "No subscription found".

