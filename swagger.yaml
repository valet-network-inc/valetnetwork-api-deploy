          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to accept this transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transfer request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

