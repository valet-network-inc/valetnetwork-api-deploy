        '200':
          description: Distances calculated

  /notification/send:
    post:
      summary: Send notification to user
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                title:
                  type: string
                body:
                  type: string
                data:
                  type: object
              required: [userId, title, body]
      responses:
        '200':
