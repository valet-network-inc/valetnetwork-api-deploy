                  type: string
                data:
                  type: object
              required: [userId, title, body]
      responses:
        '200':
          description: Notification sent successfully
        '503':
          description: Firebase not configured

  /notification/notify-closest-valets:
    post:
      summary: Notify closest valets to pickup location
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupLocation:
                  type: object
