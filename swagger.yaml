  /order/calculateConversationDistances:
    post:
      summary: Calculate distances for order matching
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickupLocation:
                  type: object
                valetLocations:
                  type: array
                  items:
                    type: object
