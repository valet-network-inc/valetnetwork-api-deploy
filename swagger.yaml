  /notification/send-push:
    post:
      summary: Send push notification to a single user
      tags: [Notification]
      description: Send a push notification to a specific user using their Firebase UID. Retrieves FCM token from Firestore and sends notification via Firebase Cloud Messaging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
