  /key-transfer/audit-logs:
    get:
      summary: Get key transfer audit logs
      tags: [Key Transfer]
      description: Retrieves immutable audit trail of all key transfer activities
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
          description: Current valet user ID
        - in: query
          name: transferId
          schema:
            type: string
          description: Filter by transfer ID
        - in: query
          name: senderValetId
          schema:
            type: string
          description: Filter by sender valet ID
        - in: query
          name: receiverValetId
          schema:
            type: string
          description: Filter by receiver valet ID
        - in: query
          name: action
          schema:
            type: string
            enum: [initiated, accepted, rejected, cancelled]
          description: Filter by action type
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Number of records to return
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
          description: Number of records to skip
      responses:
        '200':
          description: Audit logs with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KeyTransferAudit'
